<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GONAF+ | Recharge</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      color: #111;
    }

    header {
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      cursor: pointer;
    }

    .logo span {
      color: #19c37d;
    }

    .language {
      border: 1px solid #ddd;
      background: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 45px;
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #e8faf2;
      color: #159463;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 46px;
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .hero p {
      max-width: 570px;
      margin: auto;
      color: #737780;
      line-height: 1.6;
    }

    .services {
      max-width: 1050px;
      margin: auto;
      padding: 20px;
    }

    .section-title {
      margin-bottom: 22px;
    }

    .section-title small {
      color: #777;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .section-title h2 {
      margin-top: 8px;
      font-size: 29px;
    }

    .section-title p {
      color: #777;
      margin-top: 5px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .service-card {
      width: 100%;
      border: 1px solid #e5e5e5;
      background: white;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      text-align: left;
      transition: .2s;
    }

    .service-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
    }

    .icon {
      width: 50px;
      height: 50px;
      min-width: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .wise { background: #e8fff4; color: #163f31; }
    .pana { background: #eee9ff; color: #6845d8; }
    .meru { background: #eaf2ff; color: #2966d9; }
    .paypal { background: #e8f1ff; color: #1464d2; }
    .cashapp { background: #e8faed; color: #18a558; }
    .usdc { background: #eef2ff; color: #4f46e5; }

    .service-info { flex: 1; }

    .service-info h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .service-info p {
      color: #777;
      font-size: 13px;
    }

    .arrow {
      color: #999;
      font-size: 20px;
    }

    footer {
      margin-top: 80px;
      padding: 45px 20px;
      text-align: center;
      background: white;
      border-top: 1px solid #eee;
    }

    footer strong { font-size: 22px; }
    footer strong span { color: #19c37d; }

    footer p {
      color: #777;
      font-size: 13px;
      margin-top: 8px;
    }

    .page {
      max-width: 650px;
      margin: auto;
      padding: 50px 20px;
    }

    .back {
      border: none;
      background: none;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .box {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 22px;
      padding: 30px;
    }

    .box h1 {
      font-size: 34px;
      margin: 15px 0 8px;
    }

    .box p { color: #777; }

    .error-msg {
      color: #d33;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    .amount-label {
      display: block;
      margin-top: 30px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .amount-box {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 0 15px;
    }

    .amount-box span {
      font-size: 22px;
      font-weight: bold;
    }

    .amount-box input {
      width: 100%;
      border: none;
      outline: none;
      padding: 17px 10px;
      font-size: 22px;
    }

    .primary {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-top: 20px;
      background: #111;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .secondary {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      background: white;
      color: #111;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .payment-card {
      width: 100%;
      background: white;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 18px;
      margin-top: 12px;
      text-align: left;
      cursor: pointer;
    }

    .payment-card strong { display: block; margin-bottom: 5px; }
    .payment-card span { color: #777; font-size: 13px; }

    .summary {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 20px;
      margin-top: 25px;
      margin-bottom: 20px;
    }

    .summary-row { margin-bottom: 18px; }
    .summary-row:last-child { margin-bottom: 0; }
    .summary-row small { color: #777; }

    @media (max-width: 700px) {
      .hero h1 { font-size: 40px; }
      .services-grid { grid-template-columns: 1fr; }
    }

  </style>

</head>


<body>


  <div id="app"></div>


  <script>

    // =========================================
    // GONAF+ FRONTEND
    // =========================================

    // Montant maximum autorisé par recharge (à ajuster selon les règles métier)
    const MAX_AMOUNT = 5000;

    let selectedService = "";
    let selectedAmount = 0;
    let selectedPayment = "";


    // =========================================
    // HEADER (partagé sur toutes les pages,
    // évite la duplication et les incohérences)
    // =========================================

    function renderHeader() {

      return `

        <header>

          <div class="logo" onclick="home()">
            GONAF<span>+</span>
          </div>

          <button class="language" onclick="alert('Sélection de langue à venir.')">
            EN
          </button>

        </header>

      `;

    }


    // =========================================
    // HOME
    // =========================================

    function home() {

      selectedService = "";
      selectedAmount = 0;
      selectedPayment = "";

      document.getElementById("app").innerHTML = `

        ${renderHeader()}


        <section class="hero">

          <div class="badge">
            FAST • SIMPLE • SECURE
          </div>

          <h1>
            Recharge your<br>
            favorite services.
          </h1>

          <p>
            Fast and simple recharge services for
            Wise, Pana, Meru, PayPal, Cash App
            and USDC on Base.
          </p>

        </section>


        <section class="services">

          <div class="section-title">

            <small>
              OUR SERVICES
            </small>

            <h2>
              What do you want to recharge?
            </h2>

            <p>
              Select a service to continue.
            </p>

          </div>


          <div class="services-grid">

            ${serviceCard("Wise", "W", "wise", "Add funds to your Wise account.")}
            ${serviceCard("Pana", "P", "pana", "Recharge your Pana account.")}
            ${serviceCard("Meru", "M", "meru", "Recharge your Meru account.")}
            ${serviceCard("PayPal", "P", "paypal", "Add funds to your PayPal account.")}
            ${serviceCard("Cash App", "$", "cashapp", "Recharge your Cash App balance.")}
            ${serviceCard("USDC/Base", "$", "usdc", "Receive USDC on Base network.")}

          </div>

        </section>


        <footer>

          <strong>
            GONAF<span>+</span>
          </strong>

          <p>
            Your gateway to simple digital services.
          </p>

          <p>
            © 2026 GONAF+. All rights reserved.
          </p>

        </footer>

      `;

    }


    // =========================================
    // SERVICE CARD
    // =========================================

    function serviceCard(name, icon, className, description) {

      return `

        <button
          class="service-card"
          onclick="selectService('${name}')"
        >

          <div class="icon ${className}">
            ${icon}
          </div>

          <div class="service-info">
            <h3>Recharge ${name}</h3>
            <p>${description}</p>
          </div>

          <div class="arrow">→</div>

        </button>

      `;

    }


    // =========================================
    // SELECT SERVICE
    // =========================================

    function selectService(service) {

      selectedService = service;
      amountPage();

    }


    // =========================================
    // AMOUNT PAGE
    // =========================================

    function amountPage() {

      document.getElementById("app").innerHTML = `

        ${renderHeader()}

        <main class="page">

          <button class="back" onclick="home()">← Back</button>

          <div class="box">

            <div class="badge">RECHARGE SERVICE</div>

            <h1>Recharge ${selectedService}</h1>

            <p>Enter the amount you want to recharge.</p>

            <label class="amount-label">Amount</label>

            <div class="amount-box">
              <span>$</span>
              <input
                id="amountInput"
                type="number"
                min="1"
                max="${MAX_AMOUNT}"
                step="0.01"
                placeholder="0.00"
                onkeydown="if(event.key === 'Enter') continueAmount();"
              >
            </div>

            <div id="amountError" class="error-msg"></div>

            <button class="primary" onclick="continueAmount()">
              Continue
            </button>

          </div>

        </main>

      `;

      // Focus direct pour que l'utilisateur puisse taper immédiatement
      document.getElementById("amountInput").focus();

    }


    // =========================================
    // CONTINUE AMOUNT
    // =========================================

    function continueAmount() {

      const input = document.getElementById("amountInput");
      const errorEl = document.getElementById("amountError");
      const amount = parseFloat(input.value);

      errorEl.style.display = "none";

      if (input.value.trim() === "" || isNaN(amount)) {
        errorEl.textContent = "Please enter a valid amount.";
        errorEl.style.display = "block";
        return;
      }

      if (amount <= 0) {
        errorEl.textContent = "Amount must be greater than zero.";
        errorEl.style.display = "block";
        return;
      }

      if (amount > MAX_AMOUNT) {
        errorEl.textContent = `Maximum amount per recharge is $${MAX_AMOUNT}.`;
        errorEl.style.display = "block";
        return;
      }

      // Arrondi à 2 décimales pour éviter les erreurs de virgule flottante
      selectedAmount = Math.round(amount * 100) / 100;

      paymentPage();

    }


    // =========================================
    // PAYMENT PAGE
    // =========================================

    function paymentPage() {

      let methods = [
        { name: "MonCash", description: "For customers in Haiti or Dominican Republic" },
        { name: "Banco Popular", description: "For customers living in Dominican Republic" },
        { name: "USDC / Base", description: "Pay with USDC on Base network" },
        { name: "PayPal", description: "Pay using PayPal" }
      ];

      // PayPal cannot be used to recharge PayPal.
      if (selectedService === "PayPal") {
        methods = methods.filter(method => method.name !== "PayPal");
      }

      // USDC/Base cannot be used to recharge USDC/Base.
      if (selectedService === "USDC/Base") {
        methods = methods.filter(method => method.name !== "USDC / Base");
      }

      document.getElementById("app").innerHTML = `

        ${renderHeader()}

        <main class="page">

          <button class="back" onclick="amountPage()">← Back</button>

          <div class="box">

            <div class="badge">PAYMENT METHOD</div>

            <h1>Choose how to pay</h1>

            <p>
              Recharge <strong>${selectedService}</strong>
              <br>
              Amount: <strong>$${selectedAmount.toFixed(2)}</strong>
            </p>

            <div style="margin-top:25px;">

              ${methods.map(method => `
                    <button class="payment-card" onclick="selectPayment('${method.name}')">
                      <strong>${method.name}</strong>
                      <span>${method.description}</span>
                    </button>
                  `).join("")}

            </div>

          </div>

        </main>

      `;

    }


    // =========================================
    // SELECT PAYMENT
    // =========================================

    function selectPayment(method) {

      selectedPayment = method;
      confirmationPage();

    }


    // =========================================
    // CONFIRMATION
    // =========================================

    function confirmationPage() {

      document.getElementById("app").innerHTML = `

        ${renderHeader()}

        <main class="page">

          <button class="back" onclick="paymentPage()">← Back</button>

          <div class="box">

            <div class="badge">ORDER SUMMARY</div>

            <h1>Confirm your order</h1>

            <div class="summary">

              <div class="summary-row">
                <small>Service</small><br>
                <strong>Recharge ${selectedService}</strong>
              </div>

              <div class="summary-row">
                <small>Amount</small><br>
                <strong>$${selectedAmount.toFixed(2)}</strong>
              </div>

              <div class="summary-row">
                <small>Payment method</small><br>
                <strong>${selectedPayment}</strong>
              </div>

            </div>

            <button class="primary" onclick="createOrder()">
              Confirm Order
            </button>

          </div>

        </main>

      `;

    }


    // =========================================
    // CREATE ORDER
    // =========================================

    function generateOrderId() {

      // Combine timestamp (unique par milliseconde) + suffixe aléatoire
      // pour réduire fortement le risque de collision par rapport
      // à Math.random() seul.
      const timestamp = Date.now().toString(36).toUpperCase();
      const randomPart = Math.floor(1000 + Math.random() * 9000);

      return "GNF-" + timestamp + "-" + randomPart;

    }

    function createOrder() {

      const orderId = generateOrderId();

      document.getElementById("app").innerHTML = `

        ${renderHeader()}

        <main
          style="
            min-height: calc(100vh - 70px);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
          "
        >

          <div class="box" style="width:100%; max-width:500px; text-align:center;">

            <div style="font-size:55px; margin-bottom:15px;">✓</div>

            <h1>Order Created</h1>

            <p>Your recharge order has been created.</p>

            <div
              style="
                margin:25px 0;
                padding:18px;
                background:#f5f5f5;
                border-radius:14px;
                font-weight:bold;
                font-size:18px;
                word-break: break-all;
              "
            >
              ${orderId}
            </div>

            <div style="text-align:left; line-height:2;">
              <strong>Service:</strong> Recharge ${selectedService}<br>
              <strong>Amount:</strong> $${selectedAmount.toFixed(2)}<br>
              <strong>Payment:</strong> ${selectedPayment}
            </div>

            <p style="margin-top:25px; font-size:13px;">
              Payment instructions will be connected in the next step.
            </p>

            <button class="secondary" onclick="home()">
              Make another recharge
            </button>

          </div>

        </main>

      `;

    }


    // =========================================
    // LOAD HOME
    // =========================================

    home();

  </script>


</body>

  </html>
