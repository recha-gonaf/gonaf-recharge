<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>GONAF+ — Recharge</title>
<meta name="description" content="GONAF+ — Rechargez Wise, Pana, Meru, PayPal, Cash App et USDC sur Base.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --green-900:#062A1E;
    --green-700:#0B6E4F;
    --green-600:#0E8C61;
    --green-500:#14A876;
    --mint-400:#5FE3AE;
    --ink:#0B0F0E;
    --ink-soft:#455049;
    --gray-500:#6B7A73;
    --gray-300:#D8E2DC;
    --gray-100:#EEF3F0;
    --paper:#FBFDFC;
    --white:#FFFFFF;
    --red-600:#C63C3C;
    --red-50:#FCEDED;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(6,42,30,0.04), 0 8px 24px -12px rgba(6,42,30,0.12);
    --shadow-lift:0 4px 10px rgba(6,42,30,0.06), 0 20px 40px -16px rgba(6,42,30,0.18);
    --font-display:'Manrope', 'Inter', system-ui, sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--green-600);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    background:rgba(251,253,252,0.85);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--gray-100);
  }
  .logo{
    display:flex; align-items:center;
    background:none; border:none; cursor:pointer; padding:4px 0;
  }
  .logo-img{ height:28px; width:auto; display:block; }
  .lang-switch{
    display:flex; align-items:center; gap:2px;
    background:var(--gray-100);
    border-radius:999px;
    padding:3px;
  }
  .lang-btn{
    border:none; background:transparent; cursor:pointer;
    padding:7px 14px; border-radius:999px;
    font-size:13px; font-weight:700; letter-spacing:0.02em;
    color:var(--gray-500);
    transition:background 0.2s, color 0.2s;
  }
  .lang-btn.active{ background:var(--ink); color:var(--white); }

  /* ---------- Global banner (settings load state) ---------- */
  .global-banner{
    max-width:640px; margin:14px auto 0; padding:13px 16px;
    border-radius:var(--radius-md); background:var(--red-50); border:1px solid #F3C6C6;
    color:var(--red-600); font-size:13.5px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .global-banner.loading{ background:var(--gray-100); border-color:var(--gray-300); color:var(--ink-soft); }
  .global-banner button{ flex:0 0 auto; }

  /* ---------- Progress rail ---------- */
  .progress-rail{
    display:flex; gap:5px; padding:14px 20px 0;
    max-width:640px; margin:0 auto;
  }
  .progress-seg{
    flex:1; height:4px; border-radius:4px; background:var(--gray-200,#E3EAE6);
    background:var(--gray-100);
    overflow:hidden;
  }
  .progress-seg i{
    display:block; height:100%; width:0%; background:var(--green-600);
    transition:width 0.4s ease;
  }
  .progress-seg.done i{width:100%;}
  .progress-seg.active i{width:55%;}

  /* ---------- Layout ---------- */
  main{ max-width:640px; margin:0 auto; padding:28px 20px 100px; }
  .screen{ display:none; animation:fadeUp 0.35s ease; }
  .screen.visible{ display:block; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Hero ---------- */
  .hero{ padding:20px 0 8px; }
  .hero h1{
    font-family:var(--font-display);
    font-size:34px; font-weight:800; letter-spacing:-0.03em;
    line-height:1.12; margin:0 0 12px; color:var(--ink);
  }
  .hero p{ font-size:16px; color:var(--ink-soft); margin:0 0 28px; max-width:46ch; }

  /* ---------- Service grid ---------- */
  .service-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    transition:opacity 0.2s ease;
  }
  .service-grid.disabled{ opacity:0.45; pointer-events:none; }
  .service-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:14px;
    text-align:left; background:var(--white); border:1px solid var(--gray-100);
    border-radius:var(--radius-lg); padding:18px 16px; cursor:pointer;
    box-shadow:var(--shadow-card);
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .service-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--gray-300); }
  .service-card:active{ transform:translateY(0); }
  .service-logo{
    width:44px; height:44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--gray-100); border:1px solid var(--gray-100);
    padding:8px; overflow:hidden;
  }
  .service-logo img{
    width:100%; height:100%; object-fit:contain; object-position:center;
    display:block;
  }
  .service-name{ font-weight:700; font-size:14.5px; color:var(--ink); letter-spacing:-0.01em; }
  .service-sub{ font-size:12.5px; color:var(--gray-500); margin-top:-8px; }

  /* ---------- Step header ---------- */
  .step-header{ margin-bottom:24px; }
  .step-eyebrow{
    font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--green-600); margin:0 0 6px;
  }
  .step-title{
    font-family:var(--font-display); font-size:24px; font-weight:800;
    letter-spacing:-0.02em; margin:0 0 6px; color:var(--ink);
  }
  .step-desc{ font-size:14.5px; color:var(--ink-soft); margin:0; }

  /* ---------- Form ---------- */
  .field{ margin-bottom:18px; }
  .field label{
    display:block; font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:7px;
  }
  .field .req{ color:var(--green-600); }
  .field input, .field select{
    width:100%; padding:14px 16px; border-radius:var(--radius-md);
    border:1.5px solid var(--gray-300); background:var(--white);
    font-size:16px; color:var(--ink); font-family:inherit;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input::placeholder{ color:#9AA69F; }
  .field input:focus, .field select:focus{
    border-color:var(--green-600); box-shadow:0 0 0 4px rgba(14,140,97,0.12); outline:none;
  }
  .field.has-error input{ border-color:var(--red-600); }
  .field.has-error .field-error{ display:block; }
  .field-error{
    display:none; font-size:12.5px; color:var(--red-600); margin-top:6px; font-weight:500;
  }
  .field-hint{ font-size:12.5px; color:var(--gray-500); margin-top:6px; }
  .amount-input-wrap{ position:relative; }
  .amount-input-wrap input{ padding-left:44px; font-weight:700; font-family:var(--font-display); font-size:22px; }
  .amount-currency{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    font-family:var(--font-display); font-weight:700; color:var(--gray-500); font-size:22px;
  }

  /* ---------- Buttons ---------- */
  .btn-row{ display:flex; gap:10px; margin-top:8px; }
  .btn{
    flex:1; padding:16px 20px; border-radius:var(--radius-md); border:none;
    font-size:15.5px; font-weight:700; cursor:pointer; text-align:center;
    transition:background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--ink); color:var(--white); }
  .btn-primary:hover{ background:#000; }
  .btn-primary:disabled{ background:var(--gray-300); color:var(--gray-500); cursor:not-allowed; transform:none; }
  .btn-secondary{ background:var(--gray-100); color:var(--ink); flex:0 0 auto; padding:16px 22px; }
  .btn-secondary:hover{ background:var(--gray-300); }
  .btn-full{ width:100%; }

  /* ---------- Payment method list ---------- */
  .method-list{ display:flex; flex-direction:column; gap:10px; }
  .method-option{
    display:flex; align-items:center; gap:14px;
    background:var(--white); border:1.5px solid var(--gray-300);
    border-radius:var(--radius-md); padding:16px; cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .method-option:hover{ border-color:var(--green-500); }
  .method-option.selected{ border-color:var(--green-600); background:#F1FBF6; }
  .method-badge{
    width:42px; height:42px; border-radius:10px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:var(--gray-100); border:1px solid var(--gray-100);
    padding:7px; overflow:hidden;
  }
  .method-badge img{
    width:100%; height:100%; object-fit:contain; object-position:center;
    display:block;
  }
  .method-name{ font-weight:700; font-size:14.5px; }
  .method-arrow{ margin-left:auto; color:var(--gray-500); font-size:18px; }

  /* ---------- Info / instruction cards ---------- */
  .info-card{
    background:var(--white); border:1px solid var(--gray-100); border-radius:var(--radius-lg);
    padding:20px; box-shadow:var(--shadow-card); margin-bottom:16px;
  }
  .info-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--gray-100);
  }
  .info-row:last-child{ border-bottom:none; }
  .info-label{ font-size:12.5px; color:var(--gray-500); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .info-value{ font-size:15px; font-weight:700; color:var(--ink); text-align:right; word-break:break-word; }
  .info-row-highlight .info-value{ color:var(--green-700); font-size:18px; }
  .copy-btn{
    flex:0 0 auto; border:1px solid var(--gray-300); background:var(--white);
    border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700;
    color:var(--ink); cursor:pointer; white-space:nowrap;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .copy-btn:hover{ background:var(--gray-100); }
  .copy-btn.copied{ background:var(--green-600); border-color:var(--green-600); color:var(--white); }

  .banner-note{
    display:flex; gap:10px; align-items:flex-start;
    background:#F1FBF6; border:1px solid #C9EFDD; color:var(--green-900);
    border-radius:var(--radius-md); padding:14px 16px; font-size:13.5px; font-weight:600;
    margin-bottom:18px;
  }

  /* ---------- Warning block (USDC) ---------- */
  .warning-card{
    background:#FFF7ED; border:1.5px solid #FBD9A6; border-radius:var(--radius-lg);
    padding:18px; margin:6px 0 18px;
  }
  .warning-title{ font-weight:800; font-size:15px; color:#9A5B00; margin:0 0 8px; }
  .warning-body{ font-size:13.5px; color:#7A4A00; margin:0; white-space:pre-line; line-height:1.55; }
  .checkbox-row{ display:flex; align-items:flex-start; gap:10px; margin-top:16px; }
  .checkbox-row input[type="checkbox"]{
    width:20px; height:20px; margin-top:1px; flex:0 0 auto; accent-color:var(--green-600);
  }
  .checkbox-row label{ font-size:13.5px; font-weight:600; color:var(--ink); }

  /* ---------- Upload ---------- */
  .upload-zone{
    border:1.5px dashed var(--gray-300); border-radius:var(--radius-lg);
    padding:28px 20px; text-align:center; cursor:pointer; background:var(--white);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .upload-zone:hover{ border-color:var(--green-500); background:#F8FDFB; }
  .upload-zone .icon{ font-size:28px; margin-bottom:8px; }
  .upload-zone .main{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .upload-zone .sub{ font-size:12.5px; color:var(--gray-500); margin-top:4px; }
  input[type="file"]{ display:none; }
  .proof-preview{
    display:flex; align-items:center; gap:14px;
    background:var(--white); border:1px solid var(--gray-100); border-radius:var(--radius-lg);
    padding:14px; box-shadow:var(--shadow-card);
  }
  .proof-preview img{
    width:64px; height:64px; object-fit:cover; border-radius:var(--radius-sm); flex:0 0 auto;
    border:1px solid var(--gray-100);
  }
  .proof-meta{ flex:1; min-width:0; }
  .proof-filename{ font-weight:700; font-size:13.5px; word-break:break-all; }
  .proof-filesize{ font-size:12.5px; color:var(--gray-500); margin-top:3px; }
  .proof-remove{
    flex:0 0 auto; border:none; background:var(--gray-100); color:var(--ink);
    width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:16px; font-weight:700;
  }
  .proof-remove:hover{ background:var(--gray-300); }

  /* ---------- Order Created ---------- */
  .success-wrap{ text-align:center; padding:20px 0; }
  .success-check{
    width:72px; height:72px; border-radius:50%; margin:0 auto 22px;
    background:var(--green-600); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800;
    animation:pop 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ from{ transform:scale(0); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .success-title{ font-family:var(--font-display); font-size:26px; font-weight:800; margin:0 0 10px; letter-spacing:-0.02em; }
  .success-msg{ font-size:14.5px; color:var(--ink-soft); margin:0 auto 6px; max-width:40ch; }
  .status-pill{
    display:inline-block; background:#FFF3D6; color:#8A6100; font-weight:700; font-size:12px;
    padding:5px 12px; border-radius:999px; letter-spacing:0.03em; text-transform:uppercase;
  }

  footer{
    text-align:center; padding:24px 20px 40px; font-size:12px; color:var(--gray-500);
  }

  @media (max-width:420px){
    .hero h1{ font-size:28px; }
    .service-grid{ gap:10px; }
    .btn-secondary{ padding:16px 16px; }
    .service-logo{ width:38px; height:38px; }
    .method-badge{ width:38px; height:38px; }
    .logo-img{ height:24px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <button class="logo" id="logoHome" aria-label="GONAF+ — accueil"><img class="logo-img" src="images/gonaf-logo.png" alt="GONAF+"></button>
  <div class="lang-switch" role="group" aria-label="Langue">
    <button class="lang-btn" id="btnFR" data-lang="fr">FR</button>
    <button class="lang-btn" id="btnHT" data-lang="ht">HT</button>
  </div>
</header>

<div class="global-banner" id="globalBanner" style="display:none;">
  <p id="globalBannerText" style="margin:0;"></p>
  <button type="button" class="copy-btn" id="retrySettingsBtn" style="display:none;"></button>
</div>

<div class="progress-rail" id="progressRail" style="display:none;"></div>

<main>

  <!-- HOME -->
  <section class="screen" id="screen-home">
    <div class="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
    </div>
    <div class="service-grid" id="serviceGrid"></div>
  </section>

  <!-- AMOUNT -->
  <section class="screen" id="screen-amount">
    <div class="step-header">
      <p class="step-eyebrow" id="amountEyebrow"></p>
      <h2 class="step-title" id="amountTitle"></h2>
    </div>
    <div class="field" id="field-amount">
      <label id="labelAmount"></label>
      <div class="amount-input-wrap">
        <span class="amount-currency">$</span>
        <input type="text" inputmode="decimal" id="inputAmount" placeholder="0.00">
      </div>
      <p class="field-error" id="errorAmount"></p>
      <p class="field-hint" id="hintAmount"></p>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="backFromAmount">←</button>
      <button class="btn btn-primary btn-full" id="continueFromAmount"></button>
    </div>
  </section>

  <!-- CUSTOMER INFO -->
  <section class="screen" id="screen-info">
    <div class="step-header">
      <p class="step-eyebrow" id="infoEyebrow"></p>
      <h2 class="step-title" id="infoTitle"></h2>
    </div>
    <div id="infoFields"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="backFromInfo">←</button>
      <button class="btn btn-primary btn-full" id="continueFromInfo"></button>
    </div>
  </section>

  <!-- PAYMENT METHOD -->
  <section class="screen" id="screen-method">
    <div class="step-header">
      <p class="step-eyebrow" id="methodEyebrow"></p>
      <h2 class="step-title" id="methodTitle"></h2>
    </div>
    <div class="method-list" id="methodList"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="backFromMethod">←</button>
    </div>
  </section>

  <!-- PAYMENT INSTRUCTIONS -->
  <section class="screen" id="screen-instructions">
    <div class="step-header">
      <p class="step-eyebrow" id="instrEyebrow"></p>
      <h2 class="step-title" id="instrTitle"></h2>
    </div>
    <div id="instrContent"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="backFromInstr">←</button>
      <button class="btn btn-primary btn-full" id="continueFromInstr"></button>
    </div>
  </section>

  <!-- PROOF -->
  <section class="screen" id="screen-proof">
    <div class="step-header">
      <p class="step-eyebrow" id="proofEyebrow"></p>
      <h2 class="step-title" id="proofTitle"></h2>
      <p class="step-desc" id="proofDesc"></p>
    </div>
    <div id="proofArea"></div>
    <p class="field-error" id="errorProof" style="display:none;"></p>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn btn-secondary" id="backFromProof">←</button>
      <button class="btn btn-primary btn-full" id="continueFromProof"></button>
    </div>
  </section>

  <!-- SUMMARY -->
  <section class="screen" id="screen-summary">
    <div class="step-header">
      <p class="step-eyebrow" id="summaryEyebrow"></p>
      <h2 class="step-title" id="summaryTitle"></h2>
    </div>
    <div id="summaryContent"></div>
    <p class="field-error" id="errorSubmit" style="display:none;"></p>
    <div class="btn-row">
      <button class="btn btn-secondary" id="backFromSummary">←</button>
      <button class="btn btn-primary btn-full" id="confirmOrder"></button>
    </div>
  </section>

  <!-- DONE -->
  <section class="screen" id="screen-done">
    <div class="success-wrap">
      <div class="success-check">✓</div>
      <h2 class="success-title" id="doneTitle"></h2>
      <p class="success-msg" id="doneMsg1"></p>
      <p class="success-msg" id="doneMsg2"></p>
    </div>
    <div class="info-card" id="doneSummary"></div>
    <button class="btn btn-primary btn-full" id="newOrderBtn"></button>
  </section>

</main>

<footer id="footerText"></footer>

  function t(key){ return T[lang][key]; }

  function isValidEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }
  function isValidUsdcAddress(v){
    return /^0x[a-fA-F0-9]{40}$/.test(v);
  }
  function formatMoney(n){
    var num = Number(n);
    var hasCents = Math.round(num * 100) % 100 !== 0;
    return "$" + num.toFixed(hasCents ? 2 : 0) + " USD";
  }
  function fmtNum(n){
    return Number(n).toLocaleString("en-US");
  }
  function formatCurrencyAmount(value, currency){
    if(currency === "HTG" || currency === "DOP"){
      return Math.round(Number(value)).toLocaleString("en-US") + " " + currency;
    }
    if(currency === "USDC"){
      return Number(value).toFixed(2) + " USDC";
    }
    return "$" + Number(value).toFixed(2) + " USD";
  }
  function calculateTotals(amountUsd, paymentMethod){
    var feePercent = SETTINGS.gonaf_fee_percent;
    var currency, rate, base;
    if(paymentMethod === "moncash"){ currency = "HTG"; rate = SETTINGS.usd_to_htg; base = amountUsd * rate; }
    else if(paymentMethod === "banco"){ currency = "DOP"; rate = SETTINGS.usd_to_dop; base = amountUsd * rate; }
    else if(paymentMethod === "usdc"){ currency = "USDC"; rate = 1; base = amountUsd; }
    else { currency = "USD"; rate = 1; base = amountUsd; }
    var feeAmount = Math.round(base * (feePercent / 100) * 100) / 100;
    var totalToPay = Math.round((base + feeAmount) * 100) / 100;
    return { currency:currency, exchangeRate:rate, feePercent:feePercent, feeAmount:feeAmount, totalToPay:totalToPay };
  }
  function formatFileSize(bytes){
    if(bytes < 1024) return bytes + " B";
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
    return (bytes/(1024*1024)).toFixed(2) + " MB";
  }
  function generateOrderId(){
    var year = new Date().getFullYear();
    var rand = "";
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    for(var i=0;i<6;i++){ rand += chars.charAt(Math.floor(Math.random()*chars.length)); }
    return "GNF-" + year + "-" + rand;
  }

  /* ============================================================
     NAVIGATION
  ============================================================ */
  function goTo(screen, opts){
    opts = opts || {};
    if(opts.push !== false){ history.push(currentScreen); }
    currentScreen = screen;
    renderScreen(screen);
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("visible"); });
    el("screen-" + screen).classList.add("visible");
    window.scrollTo({top:0, behavior:"smooth"});
    updateProgressRail(screen);
  }
  function goBack(){
    var prev = history.pop();
    if(!prev){ prev = "home"; }
    currentScreen = prev;
    renderScreen(prev);
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("visible"); });
    el("screen-" + prev).classList.add("visible");
    window.scrollTo({top:0, behavior:"smooth"});
    updateProgressRail(prev);
  }

  function updateProgressRail(screen){
    var rail = el("progressRail");
    if(screen === "home" || screen === "done"){
      rail.style.display = "none";
      return;
    }
    rail.style.display = "flex";
    var idx = STEP_SEQUENCE.indexOf(screen);
    rail.innerHTML = "";
    for(var i=0;i<STEP_SEQUENCE.length-1;i++){ // exclude "done" segment visualization end
      var seg = document.createElement("div");
      seg.className = "progress-seg";
      if(i < idx) seg.className += " done";
      else if(i === idx) seg.className += " active";
      seg.innerHTML = "<i></i>";
      rail.appendChild(seg);
    }
  }

  ============================================================ */
  function showGlobalBanner(kind){
    settingsBannerState = kind;
    var banner = el("globalBanner");
    var retryBtn = el("retrySettingsBtn");
    banner.classList.toggle("loading", kind === "loading");
    el("globalBannerText").textContent = kind === "loading" ? t("settingsLoading") : t("settingsError");
    retryBtn.style.display = kind === "error" ? "inline-block" : "none";
    retryBtn.textContent = t("retryLabel");
    banner.style.display = "flex";
  }
  function hideGlobalBanner(){
    settingsBannerState = null;
    el("globalBanner").style.display = "none";
  }
  function updateServiceGridState(){
    var grid = el("serviceGrid");
    if(grid){ grid.classList.toggle("disabled", !settingsLoaded); }
  }
  function loadSettings(){
    if(!supabaseClient){
      settingsLoaded = false;
      showGlobalBanner("error");
      updateServiceGridState();
      return Promise.resolve();
    }
    showGlobalBanner("loading");
    return supabaseClient.from("settings").select("key,value").then(function(res){
      if(res.error || !res.data){ throw res.error || new Error("no_data"); }
      var s = {};
      res.data.forEach(function(row){ s[row.key] = parseFloat(row.value); });
      var required = ["min_amount","max_amount","gonaf_fee_percent","usd_to_htg","usd_to_dop"];
      for(var i=0;i<required.length;i++){
        if(!(required[i] in s) || isNaN(s[required[i]])){ throw new Error("missing_setting_" + required[i]); }
      }
      SETTINGS = s;
      settingsLoaded = true;
      hideGlobalBanner();
      updateServiceGridState();
      if(currentScreen === "amount"){ renderAmountScreen(); }
    }).catch(function(){
      settingsLoaded = false;
      showGlobalBanner("error");
      updateServiceGridState();
    });
  }

  function renderAmountScreen(){
    el("amountEyebrow").textContent = t("amountEyebrow") + " · " + serviceLabel(order.service);
    el("amountTitle").textContent = t("amountTitle");
    el("labelAmount").innerHTML = esc(t("labelAmount")) + ' <span class="req">*</span>';
    if(settingsLoaded){
      el("hintAmount").textContent = t("hintAmount") + " : $" + fmtNum(SETTINGS.min_amount) + " – $" + fmtNum(SETTINGS.max_amount) + " USD";
    } else {
      el("hintAmount").textContent = t("settingsLoading");
    }
    el("errorAmount").textContent = "";
    el("field-amount").classList.remove("has-error");
  }

  function validateAmount(){
    var raw = el("inputAmount").value.trim().replace(",", ".");
    var errEl = el("errorAmount");
    var fieldEl = el("field-amount");
    if(!settingsLoaded){
      fieldEl.classList.add("has-error"); errEl.textContent = t("settingsError");
      return null;
    }
    if(raw === ""){
      fieldEl.classList.add("has-error"); errEl.textContent = t("errorAmountRequired");
      return null;
    }
    if(!/^\d+(\.\d{1,2})?$/.test(raw)){
      fieldEl.classList.add("has-error"); errEl.textContent = t("errorAmountInvalid");
      return null;
    }
    var num = parseFloat(raw);
    if(isNaN(num)){
      fieldEl.classList.add("has-error"); errEl.textContent = t("errorAmountInvalid");
      return null;
    }
    if(num <= 0){
      fieldEl.classList.add("has-error"); errEl.textContent = t("errorAmountZero");
      return null;
    }
    if(num < SETTINGS.min_amount){
      fieldEl.classList.add("has-error"); errEl.textContent = t("errorAmountMin") + " $" + fmtNum(SETTINGS.min_amount) + " USD.";
      return null;
    }
    if(num > SETTINGS.max_amount){
      fieldEl.classList.add("has-error"); errEl.textContent = t("errorAmountMax") + " $" + fmtNum(SETTINGS.max_amount) + " USD.";
      return null;
    }
    fieldEl.classList.remove("has-error"); errEl.textContent = "";
    return num;
  }

                '<p class="warning-title">' + esc(t("usdcWarningTitle")) + '</p>' +
                '<p class="warning-body">' + esc(t("usdcWarningBody")) + '</p>' +
                '<div class="checkbox-row">' +
                  '<input type="checkbox" id="usdcCheckbox">' +
                  '<label for="usdcCheckbox">' + esc(t("usdcCheckbox")) + '</label>' +
                '</div>' +
              '</div>';
    }

    el("infoFields").innerHTML = html;

    // restore previously entered values
    var map = {
      fullName:order.customer.fullName, wisetag:order.customer.wisetag, wiseEmail:order.customer.wiseEmail,
      merutag:order.customer.merutag, meruEmail:order.customer.meruEmail, paypalEmail:order.customer.paypalEmail,
      panaEmail:order.customer.panaEmail, panaPhone:order.customer.panaPhone,
      cashAppTag:order.customer.cashAppTag, cashAppPhone:order.customer.cashAppPhone, cashAppEmail:order.customer.cashAppEmail,
      usdcBaseAddress:order.customer.usdcBaseAddress
    };
    Object.keys(map).forEach(function(k){
      var inp = el("input-" + k);
      if(inp && map[k]) inp.value = map[k];
    });

    if(order.service === "usdc"){
      var cb = el("usdcCheckbox");
      cb.checked = usdcChecked;
      cb.addEventListener("change", function(){
        usdcChecked = cb.checked;
        updateInfoContinueState();
      });
    }
    updateInfoContinueState();

    // clear error on input
    document.querySelectorAll("#infoFields input").forEach(function(inp){
      inp.addEventListener("input", function(){
        var fieldId = inp.id.replace("input-", "");
        el("field-" + fieldId).classList.remove("has-error");
        el("error-" + fieldId).textContent = "";
        updateInfoContinueState();
      });
    });
  }

  function updateInfoContinueState(){
    var btn = el("continueFromInfo");
    if(order.service === "usdc"){
      var addr = el("input-usdcBaseAddress") ? el("input-usdcBaseAddress").value.trim() : "";
      btn.disabled = !usdcChecked;
    } else {
      btn.disabled = false;
    }
  }

  function setFieldError(fieldId, message){
    el("field-" + fieldId).classList.add("has-error");
    el("error-" + fieldId).textContent = message;
  }
  function clearFieldError(fieldId){
    var f = el("field-" + fieldId);
    if(f){ f.classList.remove("has-error"); el("error-" + fieldId).textContent = ""; }
  }

  function validateInfo(){
    var valid = true;
    var fullName = el("input-fullName").value.trim();
    clearFieldError("fullName");
    if(fullName === ""){ setFieldError("fullName", t("errorRequired")); valid = false; }

    if(order.service === "wise"){
      var wisetag = el("input-wisetag").value.trim();
      var wiseEmail = el("input-wiseEmail").value.trim();
      clearFieldError("wisetag"); clearFieldError("wiseEmail");
      if(wisetag === ""){ setFieldError("wisetag", t("errorRequired")); valid = false; }
      if(wiseEmail === ""){ setFieldError("wiseEmail", t("errorRequired")); valid = false; }
      else if(!isValidEmail(wiseEmail)){ setFieldError("wiseEmail", t("errorInvalidEmail")); valid = false; }
      if(valid){
        order.customer.wisetag = wisetag; order.customer.wiseEmail = wiseEmail;
      }
    } else if(order.service === "meru"){
      var merutag = el("input-merutag").value.trim();
      var meruEmail = el("input-meruEmail").value.trim();
      clearFieldError("merutag"); clearFieldError("meruEmail");
      if(merutag === "" && meruEmail === ""){
        setFieldError("merutag", t("errorMeruRequired"));
        valid = false;
      } else if(meruEmail !== "" && !isValidEmail(meruEmail)){
        setFieldError("meruEmail", t("errorInvalidEmail")); valid = false;
      }
      if(valid){ order.customer.merutag = merutag; order.customer.meruEmail = meruEmail; }
    } else if(order.service === "paypal"){
      var paypalEmail = el("input-paypalEmail").value.trim();
      clearFieldError("paypalEmail");
      if(paypalEmail === ""){ setFieldError("paypalEmail", t("errorRequired")); valid = false; }
      else if(!isValidEmail(paypalEmail)){ setFieldError("paypalEmail", t("errorInvalidEmail")); valid = false; }
      if(valid){ order.customer.paypalEmail = paypalEmail; }
    } else if(order.service === "pana"){
      var panaEmail = el("input-panaEmail").value.trim();
      var panaPhone = el("input-panaPhone").value.trim();
      clearFieldError("panaEmail"); clearFieldError("panaPhone");
      if(panaEmail === ""){ setFieldError("panaEmail", t("errorRequired")); valid = false; }
      else if(!isValidEmail(panaEmail)){ setFieldError("panaEmail", t("errorInvalidEmail")); valid = false; }
      if(panaPhone === ""){ setFieldError("panaPhone", t("errorRequired")); valid = false; }
      if(valid){ order.customer.panaEmail = panaEmail; order.customer.panaPhone = panaPhone; }
    } else if(order.service === "cashapp"){
      var cashAppTag = el("input-cashAppTag").value.trim();
      var cashAppPhone = el("input-cashAppPhone").value.trim();
      var cashAppEmail = el("input-cashAppEmail").value.trim();
      clearFieldError("cashAppTag"); clearFieldError("cashAppPhone"); clearFieldError("cashAppEmail");
      if(cashAppTag === "" && cashAppPhone === "" && cashAppEmail === ""){
        setFieldError("cashAppTag", t("errorCashAppRequired"));
        valid = false;
      } else if(cashAppEmail !== "" && !isValidEmail(cashAppEmail)){
        setFieldError("cashAppEmail", t("errorInvalidEmail")); valid = false;
      }
      if(valid){
        order.customer.cashAppTag = cashAppTag; order.customer.cashAppPhone = cashAppPhone; order.customer.cashAppEmail = cashAppEmail;
      }
    } else if(order.service === "usdc"){
      var addr = el("input-usdcBaseAddress").value.trim();
      clearFieldError("usdcBaseAddress");
      if(addr === ""){ setFieldError("usdcBaseAddress", t("errorRequired")); valid = false; }
      else if(!isValidUsdcAddress(addr)){ setFieldError("usdcBaseAddress", t("errorUsdcInvalid")); valid = false; }
      if(!usdcChecked){ valid = false; }
      if(valid){ order.customer.usdcBaseAddress = addr; }
    }

    if(valid){ order.customer.fullName = fullName; }
    return valid;
  }

  el("continueFromInfo").addEventListener("click", function(){
    if(!validateInfo()) return;
    goTo("method");
  });
  el("backFromInfo").addEventListener("click", goBack);

  /* ---- PAYMENT METHOD ---- */
  function renderMethodScreen(){
    el("methodEyebrow").textContent = t("methodEyebrow") + " · " + serviceLabel(order.service);
    el("methodTitle").textContent = t("methodTitle");
    var list = el("methodList");
    list.innerHTML = "";
    METHODS.forEach(function(m){
      if(order.service === "paypal" && m.id === "paypal") return;
      if(order.service === "usdc" && m.id === "usdc") return;
      var opt = document.createElement("div");
      opt.className = "method-option";
      opt.setAttribute("role","button");
      opt.setAttribute("tabindex","0");
      opt.innerHTML =
        '<div class="method-badge"><img src="' + esc(m.logo) + '" alt="' + esc(m.label) + '" loading="lazy"></div>' +
        '<div class="method-name">' + esc(m.label) + '</div>' +
        '<div class="method-arrow">→</div>';
      opt.addEventListener("click", function(id){
        return function(){ selectMethod(id); };
      }(m.id));
      opt.addEventListener("keydown", function(id){
        return function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); selectMethod(id); } };
      }(m.id));
      list.appendChild(opt);

  }
  function selectMethod(methodId){
    order.paymentMethod = methodId;
    var totals = calculateTotals(order.amount, methodId);
    order.paymentCurrency = totals.currency;
    order.exchangeRate = totals.exchangeRate;
    order.feePercent = totals.feePercent;
    order.feeAmount = totals.feeAmount;
    order.totalToPay = totals.totalToPay;
    goTo("instructions");
  }
  el("backFromMethod").addEventListener("click", goBack);

  /* ---- PAYMENT INSTRUCTIONS ---- */
  function copyToClipboard(text, btn){
    function done(){
      var original = btn.getAttribute("data-label");
      btn.textContent = t("copied");
      btn.classList.add("copied");
      setTimeout(function(){
        btn.textContent = original;
        btn.classList.remove("copied");
      }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }

  function rowSimple(label, value){
    return '<div class="info-row"><span class="info-label">' + esc(label) + '</span><span class="info-value">' + esc(value) + '</span></div>';
  }
  function rowHighlight(label, value){
    return '<div class="info-row info-row-highlight"><span class="info-label">' + esc(label) + '</span><span class="info-value">' + esc(value) + '</span></div>';
  }
  function rowCopy(label, value){
    return '<div class="info-row">' +
      '<div><div class="info-label" style="margin-bottom:4px;">' + esc(label) + '</div><div class="info-value" style="text-align:left;">' + esc(value) + '</div></div>' +
      '<button type="button" class="copy-btn" data-label="' + esc(t("copy")) + '" data-copy="' + esc(value) + '">' + esc(t("copy")) + '</button>' +
      '</div>';
  }
  function totalsCardHtml(){
    var rows = "";

      rows += rowSimple(t("totalsRate"), "1 USD = " + fmtNum(order.exchangeRate) + " " + order.paymentCurrency);
    }

    rows += rowHighlight(t("totalsToPay"), formatCurrencyAmount(order.totalToPay, order.paymentCurrency));

  function renderInstructionsScreen(){
    el("instrEyebrow").textContent = t("instrEyebrow") + " · " + methodLabel(order.paymentMethod);
    el("instrTitle").textContent = t("instrTitle");
    var html = totalsCardHtml();

      var p = PAYMENT_INFO.moncash;

      var b = PAYMENT_INFO.banco;

        sendRow +

        rowSimple(t("bancoRnc"), b.rnc) +
        rowCopy(t("bancoAccount"), b.account) +
        '</div>';

      html += '<div class="banner-note">' + esc(t("usdcOnlyWarning")) + '</div>';

        '</div>';
    } else if(order.paymentMethod === "paypal"){
      var pp = PAYMENT_INFO.paypal;
      html += '<div class="info-card">' +
        sendRow +

        rowSimple(t("paypalName"), pp.name) +
        '</div>';
    }

    el("instrContent").innerHTML = html;

    document.querySelectorAll(".copy-btn[data-copy]").forEach(function(btn){

  el("continueFromInstr").addEventListener("click", function(){
    goTo("proof");
  });
  el("backFromInstr").addEventListener("click", goBack);

  /* ---- PROOF ---- */
  function renderProofScreen(){
    el("proofEyebrow").textContent = t("proofEyebrow");
    el("proofTitle").textContent = t("proofTitle");
    el("proofDesc").textContent = t("proofDesc");
    el("errorProof").style.display = "none";
    renderProofArea();
  }

  function renderProofArea(){
    var area = el("proofArea");
    if(!proofFile){
      area.innerHTML =
        '<label class="upload-zone" for="fileInput">' +
          '<div class="icon">⬆︎</div>' +
          '<div class="main">' + esc(t("uploadMain")) + '</div>' +
          '<div class="sub">' + esc(t("uploadSub")) + '</div>' +
        '</label>' +
        '<input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/webp">';
      el("fileInput").addEventListener("change", handleFileSelect);
    } else {
      area.innerHTML =
        '<div class="proof-preview">' +
          '<img src="' + proofFile.dataUrl + '" alt="preview">' +
          '<div class="proof-meta">' +
            '<div class="proof-filename">' + esc(proofFile.fileName) + '</div>' +
            '<div class="proof-filesize">' + esc(formatFileSize(proofFile.fileSize)) + '</div>' +
          '</div>' +
          '<button type="button" class="proof-remove" id="removeProofBtn" aria-label="' + esc(t("remove")) + '">✕</button>' +
        '</div>';
      el("removeProofBtn").addEventListener("click", function(){
        proofFile = null;
        renderProofArea();
      });
    }
  }

  function handleFileSelect(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var allowedTypes = ["image/jpeg","image/jpg","image/png","image/webp"];
    var errEl = el("errorProof");
    if(allowedTypes.indexOf(file.type) === -1){
      errEl.style.display = "block";
      errEl.textContent = t("proofErrorType");
      return;
    }
    if(file.size > 5 * 1024 * 1024){
      errEl.style.display = "block";
      errEl.textContent = t("proofErrorSize");
      return;
    }
    errEl.style.display = "none";
    var reader = new FileReader();
    reader.onload = function(ev){
      proofFile = {
        fileName:file.name,
        fileType:file.type,
        fileSize:file.size,
        dataUrl:ev.target.result,
        rawFile:file
      };
      renderProofArea();
    };
    reader.readAsDataURL(file);
  }

  el("continueFromProof").addEventListener("click", function(){
    if(!proofFile){
      var errEl = el("errorProof");
      errEl.style.display = "block";
      errEl.textContent = t("proofErrorRequired");
      return;
    }
    order.paymentProof = {
      fileName:proofFile.fileName,
      fileType:proofFile.fileType,
      fileSize:formatFileSize(proofFile.fileSize)
    };
    goTo("summary");
  });
  el("backFromProof").addEventListener("click", goBack);

  /* ---- SUMMARY ---- */
  function accountInfoLines(){
    var lines = [];
    if(order.service === "wise"){
      lines.push([t("labelWiseTag"), order.customer.wisetag]);
      lines.push([t("labelWiseEmail"), order.customer.wiseEmail]);
    } else if(order.service === "meru"){
      if(order.customer.merutag) lines.push([t("labelMeruTag"), order.customer.merutag]);
      if(order.customer.meruEmail) lines.push([t("labelMeruEmail"), order.customer.meruEmail]);
    } else if(order.service === "paypal"){
      lines.push([t("labelPaypalEmail"), order.customer.paypalEmail]);
    } else if(order.service === "pana"){
      lines.push([t("labelPanaEmail"), order.customer.panaEmail]);
      lines.push([t("labelPanaPhone"), order.customer.panaPhone]);
    } else if(order.service === "cashapp"){
      if(order.customer.cashAppTag) lines.push([t("labelCashTag"), order.customer.cashAppTag]);
      if(order.customer.cashAppPhone) lines.push([t("labelCashPhone"), order.customer.cashAppPhone]);
      if(order.customer.cashAppEmail) lines.push([t("labelCashEmail"), order.customer.cashAppEmail]);
    } else if(order.service === "usdc"){
      lines.push([t("labelUsdcAddress"), order.customer.usdcBaseAddress]);
    }
    return lines;
  }

  function renderSummaryScreen(){
    el("summaryEyebrow").textContent = t("summaryEyebrow");
    el("summaryTitle").textContent = t("summaryTitle");

    var html = totalsCardHtml();

    html += '<div class="info-card">';
    html += rowSimple(t("summaryService"), t("recharge") + " " + serviceLabel(order.service));
    html += rowSimple(t("summaryCustomer"), order.customer.fullName);
    accountInfoLines().forEach(function(pair){
      html += rowSimple(pair[0], pair[1]);
    });
    html += rowSimple(t("summaryMethod"), methodLabel(order.paymentMethod));
    html += '</div>';

    html += '<div class="info-card">' +
      '<span class="info-label">' + esc(t("summaryProof")) + '</span>' +
      '<div style="margin-top:10px;">' +
        (proofFile ? '<img src="' + proofFile.dataUrl + '" alt="proof" style="width:100%; max-width:220px; border-radius:12px; border:1px solid var(--gray-100);">' : '') +
        '<div class="proof-filename" style="margin-top:8px;">' + esc(order.paymentProof.fileName) + '</div>' +
        '<div class="proof-filesize">' + esc(order.paymentProof.fileSize) + '</div>' +
      '</div>' +
    '</div>';

    el("summaryContent").innerHTML = html;
    el("errorSubmit").style.display = "none";
  }

  el("confirmOrder").addEventListener("click", function(){
    if(!proofFile || !proofFile.rawFile){
      var errEl0 = el("errorSubmit");
      errEl0.style.display = "block";
      errEl0.textContent = t("proofErrorRequired");
      return;
    }
    var btn = el("confirmOrder");
    var errEl = el("errorSubmit");
    errEl.style.display = "none";
    btn.disabled = true;
    var originalLabel = btn.textContent;
    btn.textContent = t("submitting");

    var newOrderId = generateOrderId();
    order.orderId = newOrderId;
    order.language = lang;
    order.status = "pending";
    order.createdAt = new Date().toISOString();

    uploadPaymentProof(proofFile.rawFile, newOrderId).then(function(path){
      order.paymentProof = {
        fileName:proofFile.fileName,
        fileType:proofFile.fileType,
        fileSize:formatFileSize(proofFile.fileSize),
        path:path
      };
      return submitOrder(order);
    }).then(function(){
      btn.disabled = false;
      btn.textContent = originalLabel;
      goTo("done");
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = originalLabel;
      errEl.style.display = "block";
      errEl.textContent = (err && err.stage === "upload") ? t("errorUploadFailed") : t("errorSubmitGeneric");
    });
  });
  el("backFromSummary").addEventListener("click", goBack);

  function renderDoneScreen(){
    el("doneTitle").textContent = t("doneTitle");
    el("doneMsg1").textContent = t("doneMsg1");
    el("doneMsg2").textContent = t("doneMsg2");
    var html = "";
    html += rowSimple(t("orderId"), order.orderId);
    html += rowSimple(t("summaryService"), t("recharge") + " " + serviceLabel(order.service));

  el("newOrderBtn").addEventListener("click", function(){
    order = freshOrder();
    proofFile = null;
    usdcChecked = false;
    history = [];
    goTo("home", {push:false});
  });

  /* ============================================================
     SUPABASE STORAGE + DATABASE + EDGE FUNCTION INTEGRATION
     (uses the EXISTING `orders` table, `payment-proofs` bucket and
     `notify-order` Edge Function — nothing is created here)
  ============================================================ */
  function uploadPaymentProof(file, orderId){
    if(!supabaseClient){
      var e = new Error("supabase_not_configured"); e.stage = "upload"; return Promise.reject(e);
    }
    var ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    if(["jpg","jpeg","png","webp"].indexOf(ext) === -1){ ext = "jpg"; }
    var path = orderId + "/" + Date.now() + "." + ext;
    return supabaseClient.storage.from("payment-proofs")
      .upload(path, file, { contentType:file.type, upsert:false })
      .then(function(res){
        if(res.error){ var err = new Error(res.error.message || "upload_failed"); err.stage = "upload"; throw err; }
        return path;
      })
      .catch(function(err){
        if(!err.stage){ err.stage = "upload"; }
        throw err;
      });
  }

  function saveOrder(orderData){
    if(!supabaseClient){
      var e = new Error("supabase_not_configured"); e.stage = "save"; return Promise.reject(e);
    }
    var c = orderData.customer;
    return supabaseClient.from("orders").insert({
      order_id:orderData.orderId,
      language:orderData.language,
      service:orderData.service,
      amount_usd:orderData.amount,
      payment_method:orderData.paymentMethod,
      payment_currency:orderData.paymentCurrency,
      exchange_rate:orderData.exchangeRate,
      fee_percent:orderData.feePercent,
      fee_amount:orderData.feeAmount,
      total_to_pay:orderData.totalToPay,
      customer_full_name:c.fullName,
      customer_wisetag:c.wisetag || null,
      customer_wise_email:c.wiseEmail || null,
      customer_merutag:c.merutag || null,
      customer_meru_email:c.meruEmail || null,
      customer_paypal_email:c.paypalEmail || null,
      customer_pana_email:c.panaEmail || null,
      customer_pana_phone:c.panaPhone || null,
      customer_cashapp_tag:c.cashAppTag || null,
      customer_cashapp_phone:c.cashAppPhone || null,
      customer_cashapp_email:c.cashAppEmail || null,
      customer_usdc_address:c.usdcBaseAddress || null,
      proof_path:orderData.paymentProof.path,
      status:orderData.status
    }).then(function(res){
      if(res.error){ var err = new Error(res.error.message || "insert_failed"); err.stage = "save"; throw err; }
      return res.data;
    }).catch(function(err){
      if(!err.stage){ err.stage = "save"; }
      throw err;
    });
  }

  function notifyAdmin(orderData){
    // A Telegram notification failure must never undo or hide an order
    // that has already been safely saved — it only gets logged.
    if(!supabaseClient || !supabaseClient.functions){ return Promise.resolve(); }
    return supabaseClient.functions.invoke("notify-order", { body:orderData }).catch(function(err){
      console.error("GONAF+ notify-order failed (order is still saved as pending):", err);
    });
  }

  function submitOrder(orderData){
    return saveOrder(orderData).then(function(){
      return notifyAdmin(orderData);
    }).then(function(){
      return orderData;
    });
  }

  /* ============================================================
     LANGUAGE SWITCH
  ============================================================ */

    lang = newLang;
    localStorage.setItem("gonaf_lang", lang);
    applyStaticText();

  /* ============================================================
     INIT
  ============================================================ */
  applyStaticText();
  el("screen-home").classList.add("visible");
  updateProgressRail("home");
  loadSettings();

})();
